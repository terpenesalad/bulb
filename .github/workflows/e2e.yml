name: Emulator test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        bulb: ["3.3", "3.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build app and tests
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Start simulated bulb
        run: |
          pip install --quiet tinytuya
          python3 tools/fake_bulb.py --version ${{ matrix.bulb }} --port 6668 --log /tmp/fake-state.json > /tmp/fake.log 2>&1 &
          sleep 2

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell rm -rf /data/local/tmp/halo-shots
            adb logcat -c
            adb shell am instrument -w -r -e bulbVersion ${{ matrix.bulb }} -e class app.halo.HaloE2ETest app.halo.bulb.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/instrument.txt
            mkdir -p shots && adb pull /data/local/tmp/halo-shots shots/ || true
            adb logcat -d -s Halo:D AndroidRuntime:E TestRunner:* > /tmp/logcat.txt || true
            grep -q "OK (1 test)" /tmp/instrument.txt

      - name: Check what the bulb received
        if: always()
        run: |
          cat /tmp/fake.log || true
          python3 - <<'EOF'
          import json, sys
          s = json.load(open("/tmp/fake-state.json"))
          sets = [e["set"] for e in s["log"] if isinstance(e, dict) and "set" in e]
          errors = [e for e in s["log"] if isinstance(e, dict) and "error" in e]
          print("commands received:", len(sets))
          print("final state:", s["dps"])
          print("errors:", errors)
          assert len(sets) > 10, "too few commands reached the bulb"
          assert not errors, "the bulb saw protocol errors"
          assert s["dps"]["20"] is True and s["dps"]["21"] == "white", "final state should be white and on"
          assert s["dps"]["22"] > 900, "final brightness should be near max"
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.bulb }}
          path: |
            shots/
            /tmp/logcat.txt
            /tmp/instrument.txt
            /tmp/fake.log
            /tmp/fake-state.json

      - name: Publish results to the ci-results branch
        if: always()
        run: |
          mkdir -p /tmp/results && cp -r shots /tmp/results/ 2>/dev/null || true
          cp /tmp/logcat.txt /tmp/instrument.txt /tmp/fake.log /tmp/fake-state.json /tmp/results/ 2>/dev/null || true
          cd /tmp/results
          git init -q -b main
          git config user.name "halo-ci"
          git config user.email "halo-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "E2E results for ${{ github.sha }} (bulb ${{ matrix.bulb }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-results-${{ matrix.bulb }}
