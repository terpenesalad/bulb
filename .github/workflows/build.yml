name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Start simulated bulbs
        run: |
          pip install --quiet tinytuya
          python3 tools/fake_bulb.py --version 3.3 --port 7033 > /tmp/fake33.log 2>&1 &
          python3 tools/fake_bulb.py --version 3.4 --port 7034 > /tmp/fake34.log 2>&1 &
          python3 tools/fake_bulb.py --version 3.5 --port 7035 > /tmp/fake35.log 2>&1 &
          python3 tools/fake_bulb.py --version 3.3 --port 7100 --device22 --schema v1 > /tmp/fake22.log 2>&1 &
          python3 tools/fake_bulb.py --version 3.3 --port 7101 --broadcast --broadcast-to 127.0.0.1 > /tmp/fakebc.log 2>&1 &
          sleep 2

      - name: Protocol tests
        env:
          HALO_FAKE_BULBS: "3.3:7033,3.4:7034,3.5:7035,3.3:7100"
          HALO_FAKE_BROADCAST: "1"
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.HALO_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.HALO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/halo.jks"
            echo "HALO_KEYSTORE=$RUNNER_TEMP/halo.jks" >> "$GITHUB_ENV"
            echo "HALO_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          else
            echo "HALO_KEYSTORE=$GITHUB_WORKSPACE/signing/halo.jks" >> "$GITHUB_ENV"
            echo "HALO_KEYSTORE_PASSWORD=$(cat signing/password.txt)" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "Halo-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=Halo-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Halo-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Halo ${{ steps.apk.outputs.version }}
          make_latest: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            Download **${{ steps.apk.outputs.file }}** below and open it on your phone to install.
            Built from ${{ github.sha }}.
